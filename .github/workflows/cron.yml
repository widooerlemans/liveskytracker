name: Update YouTube Streams

on:
  schedule:
    - cron: '0 */3 * * *' # Runs automatically every 3 hours
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python update_streams.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "Stream Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add streams.json
          git commit -m "Auto-update YouTube stream IDs" || exit 0
          git push
